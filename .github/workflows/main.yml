name: Build GrabMash ASIs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Compile RE4, RE5, RERev and RERev2 GrabMash
        shell: pwsh
        run: |
          foreach ($name in @("RE4_GrabMash", "RE5_GrabMash", "RERev_GrabMash", "RERev2_GrabMash")) {
            $src = Get-ChildItem -Recurse -Filter "$name.cpp" | Select-Object -First 1
            if (-not $src) { throw "$name.cpp nao encontrado" }
            Push-Location $src.DirectoryName
            cl /nologo /LD /O2 /MT /EHsc /D_CRT_SECURE_NO_WARNINGS "$name.cpp" "/Fe:$name.asi" /link user32.lib kernel32.lib
            if ($LASTEXITCODE -ne 0) { throw "Falha na compilacao: $name" }
            Pop-Location
          }

      - uses: actions/upload-artifact@v4
        with:
          name: GrabMash
          path: |
            **/RE4_GrabMash.asi
            **/RE5_GrabMash.asi
            **/RERev_GrabMash.asi
            **/RERev2_GrabMash.asi
            **/RE4_GrabMash.ini
            **/RE5_GrabMash.ini
            **/RERev_GrabMash.ini
            **/RERev2_GrabMash.ini
