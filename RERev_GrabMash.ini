[Main]
; 1 = ativa o mod
Enable=1
; Tempo (ms) para se soltar do agarrao enquanto voce segura A (ou a tecla abaixo). MENOR = MAIS RAPIDO.
; (padrao: 800)
EscapeMs=800
; 1 = o botao A do controle ativa o mod. 0 = so a tecla abaixo.
UseGamepadA=1
; tecla do TECLADO que faz o mesmo (virtual-key). 0 = desligado. Exemplos: 70 = F, 69 = E, 32 = Espaco.
; Ela so age durante o agarrao; nao use uma tecla que voce precise apertar nessa hora.
ExtraKeyVK=70
; 1 = grava RERev_GrabMash.log na pasta do .asi (ajuda a diagnosticar)
Log=1
