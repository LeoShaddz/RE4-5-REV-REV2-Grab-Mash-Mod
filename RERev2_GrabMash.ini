[Main]
Enable=1
; 1 = grava RERev2_GrabMash.log na pasta do .asi (me mande se nao funcionar)
Log=1
; Toques rapidos em A nunca sao alterados: o mod so age depois de segurar por este tempo (ms). (padrao: 150)
HoldDelayMs=150
; 1 = so simula quando o proprio jogo esta num agarrao de inimigo ou girando valvula de porta (sensores, v2).
; 0 = age sempre que o gatilho esta segurado (como na v1). Se o log mostrar "sensor desligado", fica como v1.
UseGameSensors=1
; por quantos ms o sensor continua valendo depois da ultima vez que o jogo rodou aquela funcao. (padrao: 250)
GateMs=250
; Depois de se soltar, o jogo ainda executa a funcao do agarrao por alguns segundos (animacao de recuperacao).
; Para o personagem nao andar sozinho nesse tempo, o balancar do analogico/mouse so vale nos primeiros GrabMaxMs
; (ms) de cada agarrao. Se voce se solta mais devagar e o balancar para antes da hora, AUMENTE. 0 = sem limite.
; (padrao: 3000)
GrabMaxMs=3000

; ---- CONTROLE (gatilho = segurar o botao A) ----
; 1 = A fica pulsando (apertar varias vezes): valvula e QTE de apertar rapido
PadMashA=1
; meio-ciclo (ms) do A pulsando. MENOR = MAIS RAPIDO. (padrao: 60)
PadMashPeriodMs=60
; 1 = analogico ESQUERDO balanca para os lados: soltar de agarroes
PadWiggleStick=1
; meio-ciclo (ms) do balancar do analogico. (padrao: 60)
PadWigglePeriodMs=60
; so balanca se o seu analogico esquerdo estiver parado (valores abaixo de 9000 de 32767), para nao atrapalhar
; quando voce estiver andando. (padrao: 9000)
StickIdleZone=9000
; forca do analogico simulado (0..32767) (padrao: 30000)
Amplitude=30000

; ---- TECLADO + MOUSE (gatilho = segurar a tecla abaixo) ----
; virtual-key da tecla de gatilho. 70 = F. 0 = desliga teclado/mouse. Escolha uma que nao use na hora.
ExtraKeyVK=70
; 1 = a tecla de acao do jogo pulsa (valvula/QTE). MashKeyVK = a tecla que o jogo usa para isso:
; 69 = E, 32 = Espaco, 13 = Enter. MUDE para a tecla que o seu jogo pede.
KeyMash=1
MashKeyVK=69
; meio-ciclo (ms) da tecla pulsando. (padrao: 60)
KeyMashPeriodMs=60
; 1 = o mouse balanca para os lados (soltar de agarroes)
KeyMouseWiggle=1
; meio-ciclo (ms) do balancar do mouse. (padrao: 60)
MouseWigglePeriodMs=60
; tamanho de cada movimento do mouse em pixels (aumente se nao contar, diminua se a camera balancar demais). (padrao: 60)
MouseStepPx=60
